services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: ${BUILD_TARGET:-development}
    container_name: gofiver-api
    volumes:
      - ./backend:/app
      - go-modules:/go/pkg/mod
      - uploads:/app/uploads
    env_file:
      - .env
    working_dir: /app
    networks:
      - common-net
      - gofiver-internal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${API_CPU_LIMIT:-1.0}"
          memory: "${API_MEMORY_LIMIT:-512M}"
        reservations:
          cpus: "${API_CPU_RESERVATION:-0.25}"
          memory: "${API_MEMORY_RESERVATION:-128M}"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      target: ${BUILD_TARGET:-development}
    container_name: gofiver-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - gofiver-internal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${FRONTEND_CPU_LIMIT:-0.5}"
          memory: "${FRONTEND_MEMORY_LIMIT:-256M}"
        reservations:
          cpus: "${FRONTEND_CPU_RESERVATION:-0.1}"
          memory: "${FRONTEND_MEMORY_RESERVATION:-64M}"

  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile.nginx
    container_name: gofiver-nginx
    ports:
      - "${NGINX_PORT:-8088}:80"
    depends_on:
      - api
      - frontend
    volumes:
      - uploads:/app/uploads:ro
    networks:
      - gofiver-internal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "${NGINX_CPU_LIMIT:-0.25}"
          memory: "${NGINX_MEMORY_LIMIT:-64M}"
        reservations:
          cpus: "${NGINX_CPU_RESERVATION:-0.05}"
          memory: "${NGINX_MEMORY_RESERVATION:-32M}"

volumes:
  go-modules:
  uploads:

networks:
  common-net:
    external: true
  gofiver-internal:
    driver: bridge
