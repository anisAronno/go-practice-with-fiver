services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: ${BUILD_TARGET:-development}
    container_name: gofiver-api
    volumes:
      - ./backend:/app
      - go-modules:/go/pkg/mod
      - uploads:/app/uploads
    env_file:
      - .env
    working_dir: /app
    networks:
      - common-net
      - gofiver-internal
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      target: ${BUILD_TARGET:-development}
    container_name: gofiver-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - gofiver-internal
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile.nginx
    container_name: gofiver-nginx
    ports:
      - "${NGINX_PORT:-8088}:80"
    depends_on:
      - api
      - frontend
    volumes:
      - uploads:/app/uploads:ro
    networks:
      - gofiver-internal
    restart: unless-stopped

volumes:
  go-modules:
  uploads:

networks:
  common-net:
    external: true
  gofiver-internal:
    driver: bridge
