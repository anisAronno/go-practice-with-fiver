# Production override for 1GB RAM / 1 CPU server
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  api:
    build:
      target: production
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - CACHE_ENABLED=true
      - CACHE_LIST_TTL=30s
      - CACHE_COUNT_TTL=60s
      - CACHE_DETAIL_TTL=5m
    deploy:
      resources:
        limits:
          cpus: "0.8"
          memory: 400M
        reservations:
          cpus: "0.2"
          memory: 100M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      target: production
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 64M
        reservations:
          cpus: "0.05"
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  nginx:
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 64M
        reservations:
          cpus: "0.05"
          memory: 32M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
